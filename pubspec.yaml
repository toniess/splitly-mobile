name: splitly
description: "Splitly — учёт общих расходов в группе."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  intl: any
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
  flutter_launcher_icons: ^0.14.4
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true

# Иконки: `dart run flutter_launcher_icons`. Исходники — assets/icon,
# скрипт генерации описан в README.
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#0F1115"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  min_sdk_android: 21
