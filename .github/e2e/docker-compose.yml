# Бэкенд для e2e-тестов: код splitly-backend + чистый PostgreSQL в памяти.
# Каждый прогон начинается с пустой базы, прод не трогается.
#
# В CI бэкенд лежит в ./backend (см. ci.yml). Локально, рядом со своими контейнерами:
#   BACKEND_DIR=~/path/to/splitly E2E_PORT=18080 POSTGRES_PASSWORD=x JWT_SECRET=$(openssl rand -base64 48) \
#     docker compose -p splitly-e2e -f .github/e2e/docker-compose.yml up -d --build --wait

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: splitly
      POSTGRES_USER: splitly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # База живёт только на время прогона
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitly -d splitly"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: ${BACKEND_DIR:-../../backend}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/splitly
      SPRING_DATASOURCE_USERNAME: splitly
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${E2E_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    # --wait в compose ждёт этого, а не просто запуска процесса
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness || curl -fs http://localhost:8080/actuator/health/readiness"]
      interval: 3s
      timeout: 3s
      retries: 60
