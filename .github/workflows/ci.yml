name: Проверка и релиз

# Каждый push и PR — анализатор и тесты, затем сквозной сценарий на Android-эмуляторе
# против бэкенда, собранного из splitly-backend. Тег v* — ещё и подписанная сборка:
# APK по архитектурам и AAB для Google Play уходят в GitHub Release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Та же версия, что локально (fvm): иначе сгенерированный код и форматирование поплывут
  FLUTTER_VERSION: '3.47.4'

jobs:
  check:
    name: Анализатор и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  e2e:
    name: Сквозной сценарий на эмуляторе
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Бэкенд — из его основной ветки: проверяем клиент против того, что поедет в прод
      - uses: actions/checkout@v4
        with:
          repository: toniess/splitly-backend
          path: backend

      # Чистый PostgreSQL в памяти и приложение с профилем prod. --wait ждёт readiness
      - name: Бэкенд
        env:
          POSTGRES_PASSWORD: e2e
        run: |
          export JWT_SECRET="$(openssl rand -base64 48)"
          docker compose -p e2e -f .github/e2e/docker-compose.yml up -d --build --wait

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get

      # Без доступа к /dev/kvm эмулятор x86_64 работает в разы медленнее
      - name: KVM для эмулятора
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 10.0.2.2 — адрес хост-машины изнутри эмулятора, там слушает бэкенд из compose
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: flutter test integration_test/smoke_test.dart -d emulator-5554 --dart-define=API_BASE=http://10.0.2.2:8080

      - name: Логи бэкенда
        if: failure()
        run: docker compose -p e2e -f .github/e2e/docker-compose.yml logs app --tail 300

  release:
    name: Подписанная сборка Android
    needs: [check, e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Ключ живёт только в секретах репозитория; на диске раннера — до конца job
      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          cat > android/key.properties <<PROPS
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=upload
          PROPS

      # Номер сборки для Play растёт сам: номер прогона workflow
      - run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}
      - run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes --title "Splitly $GITHUB_REF_NAME" \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk#"Android (большинство телефонов)" \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk#"Android (старые 32-битные)" \
            build/app/outputs/flutter-apk/app-x86_64-release.apk#"Android (эмуляторы x86_64)" \
            build/app/outputs/bundle/release/app-release.aab#"AAB для Google Play"
